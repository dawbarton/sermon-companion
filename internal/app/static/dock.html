<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sermon recording</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="dock">
  <div id="record-header" class="record-header hidden">
    <span id="status-dot" class="status-dot"></span>
    <span id="timer" class="timer time">00:00:00</span>
  </div>
  <div id="start-panel" class="start-panel">
    <select id="device" aria-label="Audio device to record from"></select>
    <button id="start" class="primary">Start Recording</button>
  </div>
  <div id="record-panel" class="hidden">
    <div id="presets" class="preset-grid"></div>
    <div class="actions">
      <button id="marker">Add marker</button>
      <button id="stop" class="danger">Stop service</button>
    </div>
    <p id="capture-health" class="capture-health hidden"></p>
  </div>
  <button id="open-review" class="review-button" title="Open the review and MP3 page in your web browser">Review Recordings</button>
  <p id="error" class="error"></p>
  <script src="/assets/common.js"></script>
  <script src="/assets/dock.js"></script>
</body>
</html>
