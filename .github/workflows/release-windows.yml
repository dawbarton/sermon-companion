name: Release Windows binary

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-x86-64:
    name: Build Windows x86-64 release
    runs-on: windows-2025

    steps:
      - name: Keep repository files as LF
        run: git config --global core.autocrlf input

      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up the UCRT64 C compiler
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Validate release version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
              throw "VERSION '$version' is not a semantic version."
          }
          if ($env:EVENT_NAME -eq "push") {
              if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
                  throw "Tag '$env:RELEASE_TAG' is not a semantic version tag."
              }
              if ($env:RELEASE_TAG -ne "v$version") {
                  throw "Tag '$env:RELEASE_TAG' does not match VERSION '$version'."
              }
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test with native capture enabled
        shell: pwsh
        env:
          CC: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\gcc.exe
          CGO_ENABLED: "1"
        run: go test ./... -count=1

      - name: Build release binary
        shell: pwsh
        env:
          UCRT64_CC: ${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin\gcc.exe
        run: ./scripts/build-windows.ps1 -CCompiler $env:UCRT64_CC -Version $env:RELEASE_VERSION

      - name: Check embedded version
        shell: pwsh
        run: |
          $reported = (& "dist\SermonCompanion\SermonCompanion.exe" --version | Out-String).Trim()
          if ($reported -ne "Sermon Companion $env:RELEASE_VERSION") {
              throw "Built executable reported '$reported'."
          }

      - name: Package release files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $base = "SermonCompanion-v$env:RELEASE_VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "dist\SermonCompanion\SermonCompanion.exe" "release\$base.exe"
          Compress-Archive -Path "dist\SermonCompanion" -DestinationPath "release\$base.zip"
          $files = Get-ChildItem "release" -File | Sort-Object Name
          $checksums = foreach ($file in $files) {
              $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($file.Name)"
          }
          $checksums | Set-Content "release\SHA256SUMS.txt" -Encoding ascii

      - name: Retain workflow artefacts
        uses: actions/upload-artifact@v6
        with:
          name: SermonCompanion-${{ github.ref_name }}-windows-x86_64
          path: release/*
          if-no-files-found: error

      - name: Create or update GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem "release" -File | ForEach-Object FullName
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $env:RELEASE_TAG $files --clobber
          } else {
              gh release create $env:RELEASE_TAG $files --verify-tag --generate-notes --title "Sermon Companion $env:RELEASE_TAG"
          }
